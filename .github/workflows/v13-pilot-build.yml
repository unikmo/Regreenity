name: Regreenity design excellence build

on:
  push:
    branches: [v13-pilot]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build Regreenity
        run: npm run build
      - name: Verify Design Excellence source gate
        run: |
          test -f dist/index.html
          test -f dist/marketing.css
          test -f dist/marketing.js
          grep -q "Turn guest engagement into better experiences and" dist/index.html
          grep -q "Request a pilot" dist/index.html
          grep -q 'class="skip-link"' dist/index.html
          grep -q 'id="main-content"' dist/index.html
          grep -q ':focus-visible' dist/marketing.css
          grep -q 'prefers-reduced-motion' dist/marketing.css
          ! grep -q '/recovery.css' dist/index.html
          ! grep -Rqi 'Tisonik' dist --include='*.html'
          grep -q '/media/hero-deck.jpg' dist/index.html
          grep -q '/media/crew-recognition.jpg' dist/index.html
          grep -q '/media/service-recovery.jpg' dist/index.html
          grep -q '/media/passenger-connection.jpg' dist/index.html
          grep -q '/media/social-commerce.jpg' dist/index.html
          test -f dist/media/hero-deck.jpg
          test -f dist/media/crew-recognition.jpg
          test -f dist/media/service-recovery.jpg
          test -f dist/media/passenger-connection.jpg
          test -f dist/media/social-commerce.jpg
          for page in guest-engagement-platform cruise cruise-guest-engagement cruise-mobile-app-engagement cruise-service-recovery cruise-guest-feedback cruise-onboard-revenue hotels-resorts hotel-guest-experience-software hotel-guest-app hospitality-mobile-app resort-app hotel-upselling-software hotel-ancillary-revenue solutions guest-participation service-recovery crew-and-staff-recognition guest-feedback ancillary-revenue promotions-and-rewards digital-raffles-and-campaigns request-pilot; do
            test -f "dist/$page/index.html"
            grep -q 'class="skip-link"' "dist/$page/index.html"
          done
          grep -q 'id="pilot-request-form"' dist/request-pilot/index.html
          grep -q 'aria-live="polite"' dist/request-pilot/index.html
          test -f dist/pilot-simulator/index.html
          grep -q "Regreenity Cruise v13 Pilot Simulator" dist/pilot-simulator/index.html
          test -f dist/sitemap.xml
      - name: Verify live Supabase cruise API
        run: |
          curl --fail --silent --show-error https://phhpiqwvgwlgjmyiksqe.supabase.co/functions/v1/cruiseconnect-api-v3/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
      - name: Verify pilot request endpoint CORS
        run: |
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://regreenity.com' https://phhpiqwvgwlgjmyiksqe.supabase.co/functions/v1/regreenity-pilot-request)
          test "$CODE" = "204"
      - name: Upload Vercel-ready dist
        uses: actions/upload-artifact@v4
        with:
          name: regreenity-design-excellence-dist
          path: dist
          if-no-files-found: error
