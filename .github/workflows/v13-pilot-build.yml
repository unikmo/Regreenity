name: v13 pilot build

on:
  push:
    branches: [v13-pilot]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build v13
        run: npm run build
      - name: Verify pilot route
        run: |
          test -f dist/pilot-simulator/index.html
          grep -q "Cruise Connection v13 Pilot Console" dist/pilot-simulator/index.html
      - name: Upload Vercel-ready dist
        uses: actions/upload-artifact@v4
        with:
          name: cruiseconnect-v13-dist
          path: dist
          if-no-files-found: error
