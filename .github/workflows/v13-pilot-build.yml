name: v13 pilot build

on:
  push:
    branches: [v13-pilot]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build v13
        run: npm run build
      - name: Verify pilot route in build
        run: |
          test -f dist/pilot-simulator/index.html
          grep -q "Cruise Connection v13 Pilot Console" dist/pilot-simulator/index.html
      - name: Upload Vercel-ready dist
        uses: actions/upload-artifact@v4
        with:
          name: cruiseconnect-v13-dist
          path: dist
          if-no-files-found: error
      - name: Verify live Supabase v3 health
        run: |
          curl --fail --silent --show-error \
            https://phhpiqwvgwlgjmyiksqe.supabase.co/functions/v1/cruiseconnect-api-v3/health \
            | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
      - name: Smoke test live Vercel v13 pilot
        run: |
          URL="https://cruiseconnection-pilot-git-v13-pilot-unikmos-projects.vercel.app/pilot-simulator/"
          for i in $(seq 1 18); do
            CODE=$(curl -L -sS -o /tmp/pilot.html -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ] && grep -q "Cruise Connection v13 Pilot Console" /tmp/pilot.html; then
              echo "Live v13 pilot verified: $URL"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE; waiting for Vercel deployment..."
            sleep 5
          done
          echo "Live v13 pilot did not verify within 90 seconds."
          head -c 1000 /tmp/pilot.html || true
          exit 1
