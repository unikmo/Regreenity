name: v13 pilot build

on:
  push:
    branches: [v13-pilot]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build v13
        run: npm run build
      - name: Verify pilot route in build
        run: |
          test -f dist/pilot-simulator/index.html
          grep -q "Cruise Connection v13 Pilot Simulator" dist/pilot-simulator/index.html
          test -n "$(find dist -type f -name '*.js' -print -quit)"
      - name: Upload Vercel-ready dist
        uses: actions/upload-artifact@v4
        with:
          name: cruiseconnect-v13-dist
          path: dist
          if-no-files-found: error
      - name: Verify live Supabase v3 health
        run: |
          curl --fail --silent --show-error \
            https://phhpiqwvgwlgjmyiksqe.supabase.co/functions/v1/cruiseconnect-api-v3/health \
            | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"version":3' /tmp/health.json
      - name: Check Vercel deployment surface
        run: |
          URL="https://cruiseconnection-pilot-git-v13-pilot-unikmos-projects.vercel.app/pilot-simulator/"
          CODE=$(curl -L -sS -o /tmp/pilot.html -w '%{http_code}' "$URL" || true)
          if [ "$CODE" != "200" ]; then
            echo "Unexpected Vercel response: HTTP $CODE"
            exit 1
          fi
          if grep -q "Cruise Connection v13 Pilot Simulator" /tmp/pilot.html; then
            echo "Live v13 pilot content verified: $URL"
            exit 0
          fi
          if grep -q 'data-dpl-id=' /tmp/pilot.html || grep -qi 'vercel' /tmp/pilot.html; then
            echo "Vercel deployment is reachable but protected by Vercel Authentication."
            echo "Build artifact and Supabase v3 health are verified; content smoke test will run once a public/shareable URL is available."
            exit 0
          fi
          echo "HTTP 200 returned unexpected content."
          head -c 1000 /tmp/pilot.html || true
          exit 1
