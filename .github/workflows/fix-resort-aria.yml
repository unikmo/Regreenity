name: One-time resort ARIA fix

on:
  push:
    branches:
      - build/resort-vertical-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/resort-vertical-v1
          fetch-depth: 0
      - name: Fix demo tab container semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ResortSite.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'className="resort-demo-tabs" role="tablist" aria-label="Demo views"'
          new = 'className="resort-demo-tabs" role="group" aria-label="Demo views"'
          if old not in text:
              raise SystemExit('Expected resort demo tablist markup not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-resort-aria.yml
      - name: Commit ARIA fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix resort live demo ARIA semantics'
          git push origin HEAD:build/resort-vertical-v1
