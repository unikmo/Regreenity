name: v13 static pilot release

on:
  push:
    branches: [v13-pilot]

permissions:
  contents: write

jobs:
  publish-static:
    if: ${{ !contains(github.event.head_commit.message, '[static-dist]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v13-pilot
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build full v13 pilot
        run: npm run build
      - name: Prepare static Vercel artifact
        run: |
          rm -rf pilot-static
          cp -R dist pilot-static
          test -f pilot-static/pilot-simulator/index.html
          grep -q "Cruise Connection v13 Pilot Simulator" pilot-static/pilot-simulator/index.html
          test -n "$(find pilot-static -type f -name '*.js' -print -quit)"
      - name: Commit prebuilt artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pilot-static
          if git diff --cached --quiet; then
            echo "Prebuilt artifact is already current."
            exit 0
          fi
          git commit -m "chore: publish prebuilt Cruise Connection v13 pilot [static-dist]"
          git push origin HEAD:v13-pilot
