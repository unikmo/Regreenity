name: Regreenity Vercel preview

on:
  push:
    branches: [v13-pilot]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Detect Vercel token
        id: auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Vercel preview skipped: repository has no VERCEL_TOKEN."
          fi
      - name: Link Regreenity pilot project
        if: steps.auth.outputs.available == 'true'
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_sVekjWxQpKBAOb3DWW89HdvK","projectId":"prj_8A6lUfjP2cy5xR0f1xv0IcGGAwaj"}' > .vercel/project.json
      - name: Deploy preview
        if: steps.auth.outputs.available == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(npx vercel@latest deploy --yes --token="$VERCEL_TOKEN" --scope=unikmos-projects)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Regreenity Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL/" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL/pilot-simulator/" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test pilot route
        if: steps.auth.outputs.available == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -L -s -o /tmp/pilot.html -w '%{http_code}' "$URL/pilot-simulator/" || true)
            if [ "$CODE" = "200" ] && grep -q "Regreenity Cruise v13 Pilot Simulator" /tmp/pilot.html; then
              echo "Regreenity pilot preview verified: $URL/pilot-simulator/"
              exit 0
            fi
            sleep 5
          done
          echo "Preview route did not verify."
          exit 1
