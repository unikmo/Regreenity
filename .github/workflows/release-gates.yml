name: CruiseConnect release gates
on:
  push: {branches: [main]}
  pull_request:
jobs:
  web-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:sdk
      - run: npm audit --omit=dev --audit-level=moderate
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path packages/native-ios
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: gradle -p packages/native-android :cruiseconnect:assembleDebug
