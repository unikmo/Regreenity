name: CI and release readiness
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run sbom
      - uses: actions/upload-artifact@v4
        with: { name: cyclonedx-sbom, path: artifacts/sbom.cdx.json }
  accessibility-device-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report, if-no-files-found: ignore }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle -p packages/native-android :cruiseconnect:assembleDebug :cruiseconnect:lintDebug --stacktrace
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path packages/native-ios
      - run: swift test --package-path packages/native-ios
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with: { context: ., file: packages/operator-edge/Dockerfile, load: true, tags: cruiseconnect-edge:ci }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: cruiseconnect-edge:ci, severity: HIGH,CRITICAL, exit-code: '1', ignore-unfixed: true }
